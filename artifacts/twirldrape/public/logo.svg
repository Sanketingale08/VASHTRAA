<svg xmlns="http://www.w3.org/2000/svg" viewBox="160 15 700 310" width="100%" height="100%">
  <defs>
    <style>
      .brand-title {
        font-family: 'Playfair Display', 'Didot', 'Bodoni MT', 'Cinzel', Georgia, serif;
        font-weight: 700;
        fill: #0A1F44;
      }
      .tagline-text {
        font-family: 'Cinzel', 'Playfair Display', 'Georgia', serif;
        font-weight: 600;
        fill: #0A1F44;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      @media (prefers-color-scheme: dark) {
        .brand-title-dark {
          fill: #F4F5F7;
        }
      }
    </style>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D675"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#F3D675"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2B5C"/>
      <stop offset="100%" stop-color="#051024"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#0A1F44" flood-opacity="0.2"/>
    </filter>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Overhead Gold Hairline Arc with 3-Leaf Lotus Accent -->
    <path d="M 320 28 A 115 115 0 0 0 165 208" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Top-Left Lotus Leaves Accent on Arc -->
    <g transform="translate(186, 62) rotate(-35)">
      <path d="M 0 0 C -6 -12 0 -22 0 -22 C 0 -22 6 -12 0 0 Z" fill="url(#goldGrad)"/>
      <path d="M -3 2 C -15 -4 -20 -14 -20 -14 C -20 -14 -8 -16 -3 2 Z" fill="url(#goldGrad)"/>
      <path d="M 3 2 C 15 -4 20 -14 20 -14 C 20 -14 8 -16 3 2 Z" fill="url(#goldGrad)"/>
    </g>

    <!-- Emblem: Navy "V" + Draped Saree Silhouette -->
    <!-- Right Arm of V -->
    <path d="M 180 102 L 275 102 C 265 145 240 200 270 242 C 255 242 240 230 228 205 Z" fill="url(#navyGrad)"/>
    <path d="M 178 102 L 340 102 L 272 242 L 245 242 Z" fill="url(#navyGrad)" filter="url(#subtleShadow)"/>
    <path d="M 170 106 L 205 106 C 212 118 220 135 228 152 Z" fill="url(#goldGrad)"/>

    <!-- Saree Figure (Left Arm of V) -->
    <!-- Head / Bun / Hairline Ornament -->
    <circle cx="308" cy="56" r="14" fill="url(#navyGrad)"/>
    <path d="M 300 48 C 294 44 292 36 298 32 C 304 28 312 34 308 42 Z" fill="url(#navyGrad)"/>
    <circle cx="295" cy="38" r="3" fill="url(#goldGrad)"/>
    <circle cx="320" cy="58" r="2.5" fill="url(#goldGrad)"/>

    <!-- Slender Neck & Torso Profile -->
    <path d="M 304 68 C 298 76 295 86 298 94 C 300 100 306 106 312 110" fill="none" stroke="url(#navyGrad)" stroke-width="3" stroke-linecap="round"/>

    <!-- Pallu Drape & Zari Border -->
    <path d="M 306 76 C 292 90 274 120 272 155 C 270 190 286 215 288 220 C 282 205 278 185 282 150 C 286 120 304 90 316 78 Z" fill="url(#navyGrad)"/>
    
    <!-- Flowing Saree Folds (Gold Zari Trims) -->
    <path d="M 314 76 C 296 98 278 135 276 172 C 274 200 285 225 285 225 C 280 210 278 190 280 168 C 282 135 298 102 314 76 Z" fill="url(#goldGrad)"/>
    <path d="M 316 82 C 302 106 288 140 285 175 C 283 200 292 220 292 220 C 287 205 285 188 287 170 C 290 140 304 110 316 82 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <path d="M 285 140 C 292 148 298 160 300 172" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2 2"/>
    <path d="M 278 165 C 284 175 288 188 289 200" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2 2"/>

    <!-- Wordmark Typography: "Vastraa" -->
    <!-- Large V -->
    <text x="328" y="235" class="brand-title" font-size="152" letter-spacing="-3">V</text>
    <!-- "astraa" -->
    <text x="415" y="235" class="brand-title" font-size="138" letter-spacing="-1">astraa</text>
    
    <!-- Gold Star ✦ inside second 'a' -->
    <g transform="translate(815, 186) scale(0.95)">
      <path d="M 0 -11 Q 0 0 11 0 Q 0 0 0 11 Q 0 0 -11 0 Q 0 0 0 -11 Z" fill="url(#goldGrad)"/>
    </g>

    <!-- Gold Horizontal Divider Line -->
    <line x1="262" y1="272" x2="840" y2="272" stroke="url(#goldGrad)" stroke-width="1.5"/>

    <!-- Centered 3-Petal Gold Lotus Emblem on Divider -->
    <g transform="translate(551, 272)">
      <circle cx="0" cy="0" r="10" fill="#FFF"/>
      <path d="M 0 -1 Q -7 -14 0 -22 Q 7 -14 0 -1 Z" fill="url(#goldGrad)"/>
      <path d="M -3 0 Q -18 -8 -22 2 Q -12 7 -3 0 Z" fill="url(#goldGrad)"/>
      <path d="M 3 0 Q 18 -8 22 2 Q 12 7 3 0 Z" fill="url(#goldGrad)"/>
      <circle cx="0" cy="-2" r="2.5" fill="#0A1F44"/>
    </g>

    <!-- Subtitle / Tagline: "PAITHANI AND DESIGNER SAREE" -->
    <text x="551" y="308" class="tagline-text" font-size="22" text-anchor="middle">Paithani and Designer Saree</text>
  </g>
</svg>
