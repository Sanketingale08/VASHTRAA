kind = "mobile"
previewPath = "/mobile/"
title = "TwirlDrape Mobile"
version = "1.0.0"
id = "artifacts/twirldrape-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 24295

[services.development]
run = "pnpm --filter @workspace/twirldrape-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/twirldrape-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/twirldrape-mobile", "run", "serve" ]

[services.env]
PORT = "24295"
BASE_PATH = "/mobile/"
