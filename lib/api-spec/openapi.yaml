openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product operations
  - name: vendors
    description: Vendor operations
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /pricing/quote:
    post:
      operationId: getPricingQuote
      tags: [vendors]
      summary: Get financial pricing quote
      description: Generates financial breakdown under v2 model where customer taxable base = seller base + shipping (commission is deducted only from seller)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                basePrice:
                  type: number
                shipping:
                  type: number
                gstRate:
                  type: number
                intraState:
                  type: boolean
              required: [basePrice]
      responses:
        "200":
          description: Financial quote generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingQuoteResponse"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products
      description: Returns a paginated list of products with optional filters
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
            enum: [paithani, designer]
        - name: fabric
          in: query
          schema:
            type: string
        - name: color
          in: query
          schema:
            type: string
        - name: occasion
          in: query
          schema:
            type: string
        - name: vendorId
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: sort
          in: query
          schema:
            type: string
            enum: [price_asc, price_desc, rating_desc, newest]
        - name: page
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: number
        - name: bestSeller
          in: query
          schema:
            type: boolean
        - name: newArrival
          in: query
          schema:
            type: boolean
        - name: hasDiscount
          in: query
          schema:
            type: boolean
        - name: minRating
          in: query
          schema:
            type: number
        - name: ids
          in: query
          description: Comma-separated list of product IDs to filter by
          schema:
            type: string
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"

  /products/facets:
    get:
      operationId: getProductFacets
      tags: [products]
      summary: Get product facet counts
      description: Returns counts per filter dimension for faceted search
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
            enum: [paithani, designer]
        - name: fabric
          in: query
          schema:
            type: string
        - name: color
          in: query
          schema:
            type: string
        - name: occasion
          in: query
          schema:
            type: string
        - name: vendorId
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: bestSeller
          in: query
          schema:
            type: boolean
        - name: newArrival
          in: query
          schema:
            type: boolean
        - name: hasDiscount
          in: query
          schema:
            type: boolean
        - name: minRating
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Facet counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductFacets"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a single product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /vendors:
    get:
      operationId: listVendors
      tags: [vendors]
      summary: List vendors
      responses:
        "200":
          description: List of vendors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VendorSummary"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pricing/quote:
    post:
      operationId: getPricingQuote
      tags: [pricing]
      summary: Get pricing quote
      description: Returns full itemized financial breakdown in integer paise and rupees
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [basePrice]
              properties:
                basePrice:
                  type: number
                shipping:
                  type: number
                gstRate:
                  type: number
                intraState:
                  type: boolean
      responses:
        '200':
          description: Pricing quote breakdown
        '401':
          description: Unauthorized

  /seller/settlements:
    get:
      operationId: getSellerSettlements
      tags: [vendors]
      summary: List seller settlements
      description: Returns settlement records for the authenticated seller with status and date filtering
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
        - name: endDate
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of seller settlements
        '401':
          description: Unauthorized

  /admin/financials/summary:
    get:
      operationId: getAdminFinancialsSummary
      tags: [vendors]
      summary: Admin financial summary
      description: Returns aggregated GMV, commission, GST, TCS, and settlement stats
      responses:
        '200':
          description: Financial summary
        '401':
          description: Unauthorized

  /admin/financials/ledger:
    get:
      operationId: getAdminFinancialsLedger
      tags: [vendors]
      summary: Admin financial ledger
      description: Returns paginated audit ledger of all vendor settlements
      parameters:
        - name: page
          in: query
          schema:
            type: number
        - name: limit
          in: query
          schema:
            type: number
      responses:
        '200':
          description: Paginated financial ledger
        '401':
          description: Unauthorized

components:
  schemas:
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ProductSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
        originalPrice:
          type: number
          nullable: true
        category:
          type: string
          enum: [paithani, designer]
        fabric:
          type: string
        color:
          type: string
        occasion:
          type: string
        vendorId:
          type: string
          nullable: true
        vendorName:
          type: string
        images:
          type: array
          items:
            type: string
        isBestSeller:
          type: boolean
        isNewArrival:
          type: boolean
        rating:
          type: number
        reviewCount:
          type: number
        stock:
          type: number
      required:
        - id
        - name
        - description
        - price
        - category
        - fabric
        - color
        - occasion
        - vendorName
        - images
        - isBestSeller
        - isNewArrival
        - rating
        - reviewCount
        - stock

    ProductDetail:
      allOf:
        - $ref: "#/components/schemas/ProductSummary"

    ProductListResponse:
      type: object
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/ProductSummary"
        total:
          type: number
        page:
          type: number
        limit:
          type: number
        totalPages:
          type: number
      required:
        - products
        - total
        - page
        - limit
        - totalPages

    ProductFacets:
      type: object
      properties:
        fabric:
          type: object
          additionalProperties:
            type: number
        occasion:
          type: object
          additionalProperties:
            type: number
        color:
          type: object
          additionalProperties:
            type: number
        vendor:
          type: object
          additionalProperties:
            type: number
        rating:
          type: object
          additionalProperties:
            type: number
      required:
        - fabric
        - occasion
        - color
        - vendor
        - rating

    VendorSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        location:
          type: string
        rating:
          type: number
        sareesCount:
          type: number
        avatar:
          type: string
        bio:
          type: string
          nullable: true
      required:
        - id
        - name
        - location
        - rating
        - sareesCount
        - avatar

    PricingQuoteResponse:
      type: object
      properties:
        success:
          type: boolean
        paise:
          type: object
          properties:
            pricingVersion:
              type: string
              enum: [v1, v2]
            sellerBasePrice:
              type: integer
            platformCommission:
              type: integer
            shippingFee:
              type: integer
            taxableAmount:
              type: integer
            gstAmount:
              type: integer
            cgst:
              type: integer
            sgst:
              type: integer
            igst:
              type: integer
            customerPays:
              type: integer
            gstOnCommission:
              type: integer
            tcsDeduction:
              type: integer
            sellerSettlement:
              type: integer
            platformKeeps:
              type: integer
        rupees:
          type: object
          properties:
            pricingVersion:
              type: string
              enum: [v1, v2]
            sellerBasePrice:
              type: number
            platformCommission:
              type: number
            shippingFee:
              type: number
            taxableAmount:
              type: number
            gstAmount:
              type: number
            cgst:
              type: number
            sgst:
              type: number
            igst:
              type: number
            customerPays:
              type: number
            gstOnCommission:
              type: number
            tcsDeduction:
              type: number
            sellerSettlement:
              type: number
            platformKeeps:
              type: number
